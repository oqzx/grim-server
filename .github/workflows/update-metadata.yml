name: Update artifact metadata

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-metadata.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-metadata
          delete-branch: true
          title: 'chore: refresh artifact metadata'
          commit-message: 'chore: refresh artifact metadata'
          body: 'Automated refresh from official Paper and Modrinth APIs.'
